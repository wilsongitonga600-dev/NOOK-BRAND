<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NTM — Login</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="auth-container">

        <!-- Login -->
        <section id="login-form" class="auth-card">
            <h1>Welcome back</h1>
            <p>Log in to continue to NTM.</p>

            <form id="loginForm" method="post">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Log in</button>

                <p id="loginMessage" class="auth-message"></p>
            </form>

            <button type="button" id="showSignup" class="auth-link">
                Create an account
            </button>

            <button type="button" id="showForgot" class="auth-link">
                Forgot password?
            </button>
        </section>


        <!-- Sign Up -->
        <section id="signup-form" class="auth-card hidden">
            <h1>Create your account</h1>
            <p>Get started with NTM.</p>

            <form id="signupForm" method="post">
                <label for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="signupConfirmPassword">
                    Confirm password
                </label>
                <input
                    type="password"
                    id="signupConfirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit">Create account</button>

                <p id="signupMessage" class="auth-message"></p>
            </form>

            <button type="button" id="showLogin" class="auth-link">
                Already have an account? Log in
            </button>
        </section>


        <!-- Forgot Password -->
        <section id="forgot-form" class="auth-card hidden">
            <h1>Reset your password</h1>
            <p>Enter your email and we'll send you a reset link.</p>

            <form id="forgotPasswordForm" method="post">
                <label for="forgotEmail">Email</label>
                <input
                    type="email"
                    id="forgotEmail"
                    name="email"
                    autocomplete="email"
                    required
                >

                <button type="submit">Send reset link</button>

                <p id="forgotMessage" class="auth-message"></p>
            </form>

            <button type="button" id="backToLogin" class="auth-link">
                Back to login
            </button>
        </section>

    </main>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
    eruda.init();
</script>
    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our Supabase configuration -->
    <script src="js/supabase-client.js"></script>

    <!-- Authentication logic will be added next -->
    <script src="js/auth.js"></script>

</body>
</html>
