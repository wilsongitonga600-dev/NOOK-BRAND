<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset Password — NOOK</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-logo-wrap">
    <a class="nook-logo" href="login.html" aria-label="NOOK">
      <span class="nook-letter">N</span>
      <span class="nook-o nook-o-1"></span>
      <span class="nook-o nook-o-2"></span>
      <span class="nook-letter">K</span>
    </a>
  </div>

  <div class="card auth-card">
    <h1 class="screen-title" style="font-size:22px;">Forgot password?</h1>
    <p class="tiny" style="margin:4px 0 20px;">Enter your email and we'll send you a reset link.</p>

    <div id="auth-message"></div>

    <form id="forgot-form">
      <div class="field" style="margin-bottom:8px;">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" autofocus />
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="margin-top:14px;">Send Reset Link</button>
    </form>

    <div class="auth-links">
      <a href="login.html">Back to sign in</a>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth-common.js"></script>
<script src="js/auth-forgot.js"></script>
</body>
</html>
