<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — Nook Electronics</title>
<meta name="description" content="Browse TVs, phones, audio, and home appliances at Nook Electronics.">
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('nook-theme'); } catch (e) {}
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="site-header">
  <div class="container header-bar">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <a href="index.html" class="logo">
      <span class="logo-mark"></span>
      Nook
    </a>

    <div class="header-search">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Search TVs, phones, appliances…" aria-label="Search products">
    </div>

    <div class="header-actions">
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="account.html" class="icon-btn" aria-label="Account">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
      <a href="cart.html" class="icon-btn" aria-label="Cart, 0 items" id="cartBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
  </div>

  <div class="mobile-search">
    <input type="search" id="searchInputMobile" placeholder="Search TVs, phones, appliances…" aria-label="Search products">
  </div>

  <nav class="subnav" aria-label="Categories">
    <div class="container">
      <ul class="subnav-list" id="subnavList"></ul>
    </div>
  </nav>

  <div class="mobile-drawer" id="mobileDrawer">
    <ul id="drawerList"></ul>
  </div>
</header>

<main id="main">
  <div class="container section" style="padding-block:24px 0;">
    <div class="catalog-toolbar">
      <div class="catalog-heading">
        <h1 id="catalogTitle">All products</h1>
        <p class="eyebrow" id="resultCount"></p>
      </div>
      <div class="catalog-controls">
        <select id="categorySelect" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
        <select id="sortSelect" aria-label="Sort products">
          <option value="newest">Newest</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>
  </div>

  <div class="container section" style="padding-block:20px 60px;">
    <div class="product-grid" id="productGrid"></div>

    <p id="emptyState" class="empty-state" hidden>No products match those filters.</p>

    <div class="load-more-wrap">
      <button class="btn btn-ghost" id="loadMoreBtn" hidden>Load more</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 NOOK ELECTRONICS LTD</span>
    <span>NAIROBI · KENYA</span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/products.js"></script>
</body>
</html>
