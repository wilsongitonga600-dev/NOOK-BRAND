<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — Nook Electronics</title>
<meta name="description" id="pageDescription" content="Shop electronics and appliances at Nook Electronics.">
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('nook-theme'); } catch (e) {}
    var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<header class="site-header">
  <div class="container header-bar">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <a href="index.html" class="logo">
      <span class="logo-mark"></span>
      Nook
    </a>

    <div class="header-search">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" placeholder="Search TVs, phones, appliances…" aria-label="Search products">
    </div>

    <div class="header-actions">
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="account.html" class="icon-btn" aria-label="Account">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
      <a href="cart.html" class="icon-btn" aria-label="Cart, 0 items" id="cartBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
  </div>

  <div class="mobile-search">
    <input type="search" placeholder="Search TVs, phones, appliances…" aria-label="Search products">
  </div>

  <nav class="subnav" aria-label="Categories">
    <div class="container">
      <ul class="subnav-list" id="subnavList"></ul>
    </div>
  </nav>

  <div class="mobile-drawer" id="mobileDrawer">
    <ul id="drawerList"></ul>
  </div>
</header>

<main id="main">

  <!-- Populated once the product is found -->
  <div class="container" id="productView" style="padding-block:20px 0;" hidden>
    <nav class="breadcrumb" aria-label="Breadcrumb" id="breadcrumb"></nav>

    <div class="product-detail">
      <div class="product-detail-media">
        <div class="bezel product-detail-bezel">
          <img id="pdImage" src="" alt="">
        </div>
      </div>

      <div class="product-detail-info">
        <span class="badge-inline" id="pdBadge" hidden></span>
        <h1 id="pdName"></h1>
        <div class="product-rating" id="pdRating"></div>

        <div class="product-price-row" style="margin-top:10px;">
          <span class="product-price price" id="pdPrice" style="font-size:22px;"></span>
          <span class="product-price-old" id="pdOldPrice" hidden></span>
          <span class="product-discount" id="pdDiscount" hidden></span>
        </div>

        <p class="pd-description" id="pdDescription"></p>

        <div id="pdStock"></div>

        <div class="pd-purchase-row">
          <div class="qty-stepper">
            <button class="qty-btn" id="pdQtyDown" aria-label="Decrease quantity">−</button>
            <span class="qty-value" id="pdQtyValue">1</span>
            <button class="qty-btn" id="pdQtyUp" aria-label="Increase quantity">+</button>
          </div>
          <button class="btn btn-primary" id="pdAddToCart" style="flex:1;">Add to cart</button>
        </div>

        <p class="pd-note">Free delivery details and warranty terms are confirmed at checkout.</p>
      </div>
    </div>

    <section class="section" id="relatedSection">
      <div class="section-head">
        <h2>You might also like</h2>
      </div>
      <div class="product-grid" id="relatedGrid"></div>
    </section>
  </div>

  <!-- Shown if ?id= is missing or doesn't match a product -->
  <div class="container section" id="notFound" style="padding-block:60px; text-align:center;" hidden>
    <h1 style="margin-bottom:10px;">Product not found</h1>
    <p style="color:var(--ink-soft); margin-bottom:16px;">This product may have been removed or the link is incorrect.</p>
    <a href="products.html" class="btn btn-primary">Browse all products</a>
  </div>

</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 NOOK ELECTRONICS LTD</span>
    <span>NAIROBI · KENYA</span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/product.js"></script>
</body>
</html>
